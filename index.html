<!DOCTYPE html>

<body>
    <h2>존경하는 공룡 여러분 그리고 공룡을 살아있게 해준 덕후 여러분<br>
제 3회 공룡덕후박람회에 오신 것을 진심으로 크르릉 환영합니다.<br>
1대 공통령 티라노사우루스렉스 인사드립니다.<br>
여러분들의 크르릉 응원 덕분에 이 자리에 있을 수 있었고, 
크르릉 관심 덕분에 이 자리를 마련할 수 있었습니다.<br>
요리보고 저리봐도 저희는 모두 공룡입니다.<br>
나이와 성별을 불문하고 오늘 이 자리에서는 그 동안의 일들 모두 내려놓고
모두 공룡이 될 수 있는 자리가 되었으면 좋겠습니다.<br>
다시 한번 공룡덕후박람회에 오신 것을 크르릉 환영합니다.</h2>
